@if (auth.isLoggedIn()) {
  <header class="topbar">
    <strong class="brand">Labour Payroll</strong>
    <nav class="nav">
      <a routerLink="/workers" routerLinkActive="active">Workers</a>
      @if (auth.isAdmin()) {
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
      }
    </nav>
    <button class="btn ghost small" type="button" (click)="auth.logout()">
      Log out<span class="who"> ({{ auth.user()?.name }})</span>
    </button>
  </header>
}

<main class="page">
  <router-outlet />
</main>
